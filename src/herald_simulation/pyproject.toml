[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-simulation"
version = "0.1.0"
description = "HeST (superfluid-helium quantum evaporation) -> qp_simulator -> noise_module: the paired dark-matter arm (docs/LATENT_MONITORING_PLAN_2026-09-05.md §7)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58", "qetpy", "pyarrow>=14", "noise-module", "qp-simulator"]

[tool.setuptools]
packages = ["herald_simulation"]

[tool.setuptools.package-dir]
herald_simulation = "."

[tool.uv.sources]
noise-module = { workspace = true }
qp-simulator = { workspace = true }
