[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-noise"
version = "0.1.0"
description = "Registered JEPA shared-noise development study"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "pandas>=2,<2.3", "matplotlib>=3.7,<3.10", "h5py>=3.11", "scikit-learn>=1.3", "jaxtyping>=0.2,<0.3", "torch==2.5.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["jepa_noise", "jepa_noise.configs"]

[tool.setuptools.package-dir]
jepa_noise = "."

[tool.setuptools.package-data]
jepa_noise = ["configs/*.json", "configs/*.yaml"]
